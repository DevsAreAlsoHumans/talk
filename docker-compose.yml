# docker compose up                  → lance l'application sur http://localhost:8000
# docker compose run --rm test       → lance le linter et la suite de tests (contre un vrai Redis)

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      target: runtime
    environment:
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-2592000}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    # Redis n'est joignable que depuis le réseau interne `backend`, jamais depuis l'extérieur.
    networks: [backend, default]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_REDIS_URL: redis://redis:6379/15
    depends_on:
      redis:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
    internal: true

volumes:
  redis-data:
