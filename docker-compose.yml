name: talk

services:
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:-talk-dev-password}
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-talk-dev-password}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend

  app:
    build:
      context: .
      target: runtime
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      REDIS_URL: redis://:${REDIS_PASSWORD:-talk-dev-password}@redis:6379/0
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,app}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - backend

  test:
    profiles:
      - test
    build:
      context: .
      target: test
    environment:
      ENVIRONMENT: test
      REDIS_URL: redis://:${REDIS_PASSWORD:-talk-dev-password}@redis:6379/0
      RUFF_CACHE_DIR: /tmp/ruff-cache
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["sh", "-c", "ruff check . && ruff format --check . && pytest -q -p no:cacheprovider"]
    networks:
      - backend

volumes:
  redis-data:

networks:
  backend:
    driver: bridge
