[project]
name = "talk"
version = "0.1.0"
description = "Chat chiffre de bout en bout"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1.0,<26",
    "fastapi>=0.115.0,<1",
    "motor>=3.6.0,<4",
    "pydantic-settings>=2.6.0,<3",
    "uvicorn[standard]>=0.32.0,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0,<1",
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<1",
]
lint = [
    "bandit>=1.7.0,<2",
    "ruff>=0.8.0,<1",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["B008", "S101"]
