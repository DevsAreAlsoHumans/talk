[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# `anyio` en mode auto applique le marqueur à tous les tests asynchrones, sans
# décorateur à ajouter un par un.
addopts = ["--anyio-mode=auto"]
