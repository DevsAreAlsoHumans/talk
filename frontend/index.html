<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Talk</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <main>
      <section id="chat-view" class="app-shell" hidden>
        <aside class="sidebar">
          <div class="sidebar-header">
            <span class="brand">Talk</span>
          </div>

          <details class="sidebar-panel">
            <summary>Nouveau DM</summary>
            <form id="open-dm-form">
              <input name="tag" placeholder="pseudo#0000" pattern="^.+#\d{4}$" required />
              <button type="submit" class="btn-primary">Ouvrir le DM</button>
            </form>
          </details>

          <details class="sidebar-panel">
            <summary>Nouveau groupe</summary>
            <form id="create-group-form">
              <input name="name" placeholder="Nom du groupe" required />
              <button type="submit" class="btn-primary">Créer</button>
            </form>
          </details>

          <ul id="room-list" class="room-list"></ul>

          <details class="sidebar-panel">
            <summary>Paramètres du compte</summary>

            <form id="avatar-form" class="settings-form">
              <p class="settings-label">Avatar</p>
              <input name="seed" placeholder="Seed Dicebear (ex: alice)" />
              <button type="submit" class="btn-secondary">Utiliser cette seed</button>
              <input name="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
              <button type="submit" data-action="upload" class="btn-secondary">
                Uploader une image
              </button>
            </form>

            <div id="totp-setup" class="settings-form">
              <p class="settings-label">Double authentification</p>
              <button id="totp-setup-button" class="btn-secondary">Activer la 2FA</button>
              <div id="totp-setup-details" hidden>
                <p class="hint">
                  Ajoute ce compte dans une application d'authentification (Google
                  Authenticator, Authy...), puis confirme avec le code généré.
                </p>
                <canvas id="totp-qr-canvas" class="totp-qr-canvas"></canvas>
                <div class="totp-secret-box">
                  <code id="totp-secret"></code>
                  <button type="button" id="totp-copy-secret" class="btn-secondary">Copier</button>
                </div>
                <button type="button" id="totp-copy-uri" class="btn-link">
                  Copier le lien d'import
                </button>
                <form id="totp-confirm-form">
                  <input name="code" placeholder="Code à 6 chiffres" pattern="\d{6}" required />
                  <button type="submit" class="btn-primary">Confirmer l'activation</button>
                </form>
              </div>
              <p id="totp-setup-message" class="hint"></p>
            </div>
          </details>

          <div class="sidebar-footer">
            <img id="current-avatar" class="avatar" alt="Avatar" width="32" height="32" />
            <span id="current-user" class="username"></span>
            <button id="notifications-toggle" class="icon-button" title="Notifications">
              🔔<span id="notifications-count" class="badge">0</span>
            </button>
            <button id="logout-button" class="icon-button" title="Se déconnecter">⏻</button>
          </div>
          <ul id="notifications-list" class="notifications-list" hidden></ul>
        </aside>

        <div class="main-content">
          <header class="channel-header">
            <p id="active-room-label">Choisis ou crée un salon.</p>
          </header>

          <form id="add-group-member-form" class="inline-form" hidden>
            <input name="tag" placeholder="pseudo#0000" pattern="^.+#\d{4}$" required />
            <button type="submit" class="btn-secondary">Ajouter au groupe</button>
          </form>
          <ul id="group-members-list" class="group-members-list"></ul>

          <ul id="messages" class="messages-list"></ul>

          <form id="send-form" class="message-composer" hidden>
            <input name="text" placeholder="Message..." autocomplete="off" />
            <input name="file" type="file" class="file-input" />
            <button type="submit" class="btn-primary">Envoyer</button>
          </form>
        </div>
      </section>
    </main>

    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>
