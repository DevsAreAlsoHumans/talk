<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Talk</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <section id="auth-screen" class="screen">
    <form id="auth-form" class="card">
      <div class="card-head">
        <h1>Talk</h1>
        <button type="button" id="btn-theme-auth" class="theme-toggle" aria-label="Mode sombre">◐</button>
      </div>
      <p class="muted">Messagerie chiffrée de bout en bout.</p>
      <label>
        Pseudo
        <input id="auth-username" name="username" autocomplete="username" maxlength="32" required>
      </label>
      <label>
        Mot&nbsp;de&nbsp;passe
        <input id="auth-password" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required>
      </label>
      <div class="row">
        <button type="button" id="btn-login" class="ghost">Connexion</button>
        <button type="submit">Inscription</button>
      </div>
      <p id="auth-error" class="error"></p>
    </form>
  </section>

  <section id="app-screen" class="screen" hidden>
    <aside id="sidebar">
      <div class="account">
        <span id="me-avatar" class="avatar"></span>
        <div class="account-id">
          <strong id="me-name"></strong>
          <button type="button" id="btn-logout" class="link">Déconnexion</button>
        </div>
        <button type="button" id="btn-theme" class="theme-toggle" aria-label="Mode sombre">◐</button>
      </div>
      <button type="button" id="btn-new-room" class="accent">+ Nouveau salon</button>
      <ul id="room-list" class="rooms"></ul>

      <div id="friends-pane">
        <p class="pane-head">Amis</p>
        <form id="friend-add" class="friend-add">
          <input id="friend-username" placeholder="Ajouter un ami" maxlength="32" required>
          <button type="submit">+</button>
        </form>
        <ul id="request-list" class="requests"></ul>
        <ul id="friend-list" class="friends"></ul>
      </div>
    </aside>

    <main id="chat">
      <header class="chat-header">
        <div class="chat-title">
          <h2 id="room-title">—</h2>
          <p id="room-meta" class="muted"></p>
        </div>
        <form id="invite-form" class="invite" hidden>
          <input id="invite-username" placeholder="Inviter dans le salon…" maxlength="32" required>
          <button type="submit">Inviter</button>
        </form>
        <button type="button" id="btn-search" class="ghost" title="Rechercher dans les messages déchiffrés" hidden>Rechercher</button>
        <button type="button" id="btn-export" class="ghost" title="Exporter la conversation déchiffrée" hidden>Exporter</button>
        <button type="button" id="btn-transfer" class="ghost" title="Transférer la propriété du salon" hidden>Transférer</button>
        <button type="button" id="btn-delete-rm" class="ghost danger" title="Supprimer définitivement le salon" hidden>Supprimer</button>
        <button type="button" id="btn-leave" class="ghost" title="Quitter le salon (vous perdrez l'accès)" hidden>Quitter</button>
      </header>

      <div class="chat-body">
        <aside id="channel-pane">
          <p class="pane-head">Canaux</p>
          <ul id="channel-list" class="channels"></ul>
          <button type="button" id="btn-new-channel" class="ghost">+ Canal</button>
        </aside>

        <div class="chat-col">
          <div class="chat-topic">
            <h3 id="channel-title"></h3>
            <p id="typing-hint" class="typing-hint" hidden></p>
          </div>
          <form id="search-form" class="search-bar" hidden>
            <input id="search-input" placeholder="Rechercher dans les messages déchiffrés…" autocomplete="off" maxlength="256">
            <button type="submit">Rechercher</button>
          </form>
          <div id="search-results" class="search-results" hidden></div>
          <div id="messages" class="messages" aria-live="polite"></div>

          <form id="composer" class="composer">
            <input id="composer-input" placeholder="Écrire un message chiffré..." autocomplete="off" maxlength="4096">
            <button type="submit">Envoyer</button>
          </form>
        </div>

        <aside id="member-pane">
          <p class="pane-head" id="member-head">Membres</p>
          <ul id="member-list" class="members"></ul>
        </aside>
      </div>
    </main>
  </section>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
