<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>talk — Connexion</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <header class="auth-header">
        <h1 class="auth-title">talk</h1>
        <p class="auth-subtitle">Chat chiffré de bout en bout</p>
      </header>

      <p id="auth-message" class="auth-message" role="status" hidden></p>

      <!-- Formulaire de connexion -->
      <form id="login-form" class="auth-form" novalidate>
        <div class="field">
          <label for="login-username">Nom d'utilisateur</label>
          <input type="text" id="login-username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Mot de passe</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Se connecter</button>
      </form>

      <!-- Formulaire d'inscription -->
      <form id="register-form" class="auth-form" novalidate hidden>
        <div class="field">
          <label for="register-username">Nom d'utilisateur</label>
          <input type="text" id="register-username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="register-password">Mot de passe</label>
          <input type="password" id="register-password" name="password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Créer un compte</button>
      </form>

      <footer class="auth-footer">
        <button id="toggle-mode" type="button" class="btn btn-link">Créer un compte</button>
      </footer>
    </section>
  </main>
  <script src="app.js?v=2"></script>
</body>
</html>
