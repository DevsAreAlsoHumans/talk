<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk - Chat chiffré de bout en bout</title>
    <link rel="stylesheet" href="/style.css">
    <meta name="description" content="Application de messagerie chiffrée de bout en bout, type Discord/Telegram">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="app-header">
            <h1>Talk</h1>
            <nav id="nav-links">
                <button id="btn-logout" class="btn-link">Déconnexion</button>
            </nav>
        </header>

        <!-- Main content -->
        <main id="app-main">
            <!-- Sidebar: rooms list -->
            <aside id="sidebar">
                <div id="rooms-list">
                    <div class="section-heading">
                        <h2>Serveurs</h2>
                        <div class="section-actions">
                            <button id="btn-server-settings" class="settings-button" type="button" title="Paramètres du serveur">Paramètres</button>
                            <button id="btn-create-server" class="icon-button" type="button" title="Créer un serveur">+</button>
                        </div>
                    </div>
                    <select id="server-select" class="space-select">
                        <option value="">Sélectionner un serveur</option>
                    </select>
                    <div class="section-heading">
                        <h2>Salons du serveur</h2>
                        <div class="section-actions">
                            <button id="btn-channel-settings" class="settings-button" type="button" title="Paramètres du salon">Paramètres</button>
                            <button id="btn-create-channel" class="icon-button" type="button" title="Créer un salon">+</button>
                        </div>
                    </div>
                    <select id="channel-select" class="space-select" disabled>
                        <option value="">Sélectionner un salon</option>
                    </select>
                    <div class="section-heading">
                        <h2>Groupes</h2>
                        <div class="section-actions">
                            <button id="btn-group-settings" class="settings-button" type="button" title="Paramètres du groupe">Paramètres</button>
                            <button id="btn-create-group" class="icon-button" type="button" title="Créer un groupe">+</button>
                        </div>
                    </div>
                    <select id="group-select" class="space-select">
                        <option value="">Sélectionner un groupe</option>
                    </select>
                    <div class="section-heading">
                        <h2>Messages directs</h2>
                        <div class="section-actions">
                            <button id="btn-direct-settings" class="settings-button" type="button" title="Paramètres du message direct">Paramètres</button>
                            <button id="btn-create-direct" class="icon-button" type="button" title="Créer un message direct">+</button>
                        </div>
                    </div>
                    <select id="direct-select" class="space-select">
                        <option value="">Sélectionner une conversation</option>
                    </select>
                </div>
            </aside>

            <!-- Chat area -->
            <section id="chat-area">
                <div id="chat-header">
                    <h2 id="chat-room-name">Sélectionnez un salon</h2>
                </div>
                <div id="messages-container" class="messages">
                    <p class="placeholder">Choisissez un salon pour commencer</p>
                </div>
                <div id="message-input-area">
                    <input type="text" id="message-input" placeholder="Tapez un message..." disabled>
                    <button id="btn-send" disabled>Envoyer</button>
                </div>
            </section>

            <!-- User info -->
            <aside id="user-panel">
                <h3>Utilisateur</h3>
                <div id="user-info"></div>
                <button id="btn-logout-panel" class="btn-logout-panel" type="button">Se déconnecter</button>
                <div id="e2e-status">
                    <span class="status-indicator" id="e2e-indicator"></span>
                    <span>Chiffrement E2E</span>
                </div>
            </aside>
        </main>
    </div>

    <!-- Create room modal -->
    <div id="create-room-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3 id="create-room-title">Nouvel espace</h3>
            <form id="create-room-form">
                <label for="room-name">Nom du salon</label>
                <input type="text" id="room-name" required maxlength="100">
                <label for="room-description">Description</label>
                <textarea id="room-description" maxlength="500"></textarea>
                <label id="parent-server-label" for="parent-server">Serveur parent du salon</label>
                <select id="parent-server"></select>
                <label id="member-identifiers-label" for="member-identifiers">Membres invités</label>
                <input type="text" id="member-identifiers" placeholder="nom ou email, séparés par des virgules">
                <button type="submit" class="btn-primary">Créer</button>
                <button type="button" id="btn-cancel-room">Annuler</button>
            </form>
        </div>
    </div>

    <div id="settings-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3 id="settings-title">Paramètres</h3>
            <p id="settings-description"></p>
            <h4>Membres</h4>
            <ul id="settings-member-list"></ul>
            <label for="member-identifier">Ajouter un membre</label>
            <input type="text" id="member-identifier" placeholder="Nom d'utilisateur ou email">
            <button id="btn-add-member" class="btn-primary" type="button">Ajouter le membre</button>
            <p id="member-feedback"></p>
            <button id="btn-close-settings" type="button">Fermer</button>
        </div>
    </div>

    <!-- Login form (shown initially) -->
    <div id="login-form">
        <h2>Connexion</h2>
        <form id="login-form-element">
            <label for="login-email">Email ou nom d'utilisateur</label>
            <input type="text" id="login-email" required>
            <label for="login-password">Mot de passe</label>
            <input type="password" id="login-password" required>
            <button type="submit">Se connecter</button>
            <p>Pas encore de compte ? <a href="#" id="btn-show-register">S'inscrire</a></p>
        </form>
        <form id="register-form" style="display:none;">
            <label for="reg-username">Nom d'utilisateur</label>
            <input type="text" id="reg-username" required>
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" required>
            <label for="reg-password">Mot de passe</label>
            <input type="password" id="reg-password" required>
            <button type="submit">S'inscrire</button>
            <p>Déjà un compte ? <a href="#" id="btn-show-login">Se connecter</a></p>
        </form>
    </div>

    <script src="/app.js"></script>
</body>
</html>
