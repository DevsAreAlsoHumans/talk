<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Talk</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <main>
      <h1>Talk</h1>

      <section id="auth-view">
        <div class="auth-forms">
          <form id="register-form">
            <h2>Inscription</h2>
            <input name="username" placeholder="Pseudo" required minlength="3" />
            <input name="email" type="email" placeholder="Email" required />
            <input name="password" type="password" placeholder="Mot de passe" required />
            <button type="submit">S'inscrire</button>
          </form>

          <form id="login-form">
            <h2>Connexion</h2>
            <input name="email" type="email" placeholder="Email" required />
            <input name="password" type="password" placeholder="Mot de passe" required />
            <button type="submit">Se connecter</button>
            <button type="button" id="forgot-password-link">Mot de passe oublié ?</button>
          </form>
        </div>
        <p id="auth-error" class="error"></p>
      </section>

      <section id="totp-view" hidden>
        <h2>Code de vérification</h2>
        <form id="totp-login-form">
          <input name="code" placeholder="Code à 6 chiffres" pattern="\d{6}" required />
          <button type="submit">Valider</button>
        </form>
        <p id="totp-error" class="error"></p>
      </section>

      <section id="forgot-password-view" hidden>
        <h2>Mot de passe oublié</h2>
        <form id="forgot-password-form">
          <input name="email" type="email" placeholder="Email" required />
          <button type="submit">Envoyer le lien de réinitialisation</button>
        </form>
        <p id="forgot-password-message"></p>
      </section>

      <section id="reset-password-view" hidden>
        <h2>Nouveau mot de passe</h2>
        <form id="reset-password-form">
          <input name="password" type="password" placeholder="Nouveau mot de passe" required />
          <button type="submit">Réinitialiser</button>
        </form>
        <p id="reset-password-message"></p>
      </section>

      <section id="chat-view" hidden>
        <header>
          <img id="current-avatar" alt="Avatar" width="48" height="48" />
          <span id="current-user"></span>
          <button id="logout-button">Se déconnecter</button>
        </header>

        <div id="totp-setup">
          <button id="totp-setup-button">Activer la 2FA</button>
          <div id="totp-setup-details" hidden>
            <p>Secret : <code id="totp-secret"></code></p>
            <p>URI : <code id="totp-uri"></code></p>
            <form id="totp-confirm-form">
              <input name="code" placeholder="Code à 6 chiffres" pattern="\d{6}" required />
              <button type="submit">Confirmer l'activation</button>
            </form>
          </div>
          <p id="totp-setup-message"></p>
        </div>

        <form id="avatar-form">
          <input name="seed" placeholder="Seed Dicebear (ex: alice)" />
          <button type="submit">Utiliser cette seed</button>
          <input name="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
          <button type="submit" data-action="upload">Uploader une image</button>
        </form>

        <form id="open-dm-form">
          <input name="username" placeholder="Pseudo du destinataire" required />
          <input name="discriminator" placeholder="0000" pattern="\d{4}" required />
          <button type="submit">Ouvrir le DM</button>
        </form>

        <ul id="room-list"></ul>

        <div id="active-room">
          <p id="active-room-label">Choisis ou crée un DM.</p>
          <ul id="messages"></ul>
          <form id="send-form" hidden>
            <input name="text" placeholder="Message..." autocomplete="off" required />
            <button type="submit">Envoyer</button>
          </form>
        </div>
      </section>
    </main>

    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>
