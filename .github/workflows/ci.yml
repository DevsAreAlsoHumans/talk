name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-e2e.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test backend
        run: pytest -q
        env:
          REDIS_TEST_HOST: localhost
          REDIS_TEST_PORT: 6379
          REDIS_TEST_DB: 15

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test frontend
        run: npm --prefix frontend test

      - name: Build runtime image
        run: docker build --target runtime --tag talk-ci-runtime .

      - name: Build test image
        run: docker build --target test --tag talk-ci-test .

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Browser end-to-end test
        run: |
          python -m pip install -r requirements-e2e.txt
          playwright install --with-deps chromium
          docker compose up -d app
          E2E_BASE_URL=http://127.0.0.1:8000 python tests/e2e_browser.py
