name: Vérifications
# La CI se lance à chaque push et pull request
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: pip install -r requirements-dev.txt
      # Linter
      - run: ruff check app tests
      # Tests de l'API avec la couverture (échoue sous 90 %)
      - run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=90
      # Tests du chiffrement côté navigateur
      - run: node --test "tests/*.test.js"
      # L'image Docker doit se construire
      - run: docker build -t talk .
