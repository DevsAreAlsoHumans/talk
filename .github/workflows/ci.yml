name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install ".[test,lint]"
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check app tests
      - name: Security scan
        run: python -m bandit -r app -q
