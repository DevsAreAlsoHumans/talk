# ---------------------------------------------------------------------------
# CI GitHub Actions — déclenchée à chaque push et pull request (toutes
# branches ; la branche rendue `etudiant/...` est donc couverte).
#
# Jobs :
#   1. lint          — ruff check + ruff format (qualité du code) ;
#   2. test          — pytest (unitaires + intégration) avec rapport JUnit ;
#   3. docker-build  — build de l'image (sanitize, sans push).
# ---------------------------------------------------------------------------
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format (verify)
        run: ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v --junitxml=junit.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: junit.xml
          if-no-files-found: warn

  docker-build:
    name: Docker build (sanitize)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: talk:ci
          # Cache de build partagé entre exécutions (gha cache).
          cache-from: type=gha
          cache-to: type=gha